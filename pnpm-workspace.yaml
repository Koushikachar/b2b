packages: []

# Sharp ships its binaries as platform-specific optional dependencies
# (`@img/sharp-<platform>` / `@img/sharp-libvips-<platform>`), and pnpm installs
# optional dependencies for the current platform only. `current` keeps local
# development and `pnpm test` working; `linux-x64` is the Vercel Node runtime
# (glibc). Needed by lib/admin/banners.ts image processing.
supportedArchitectures:
  - current
  - linux-x64

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  # Dev/CLI-only: local CLIP fallback for scripts + model tests, and the
  # standalone service in services/image-search/. Never imported by app routes.
  onnxruntime-node: true
  protobufjs: false
  core-js-pure: false
  esbuild: true

# SECURITY.md S-6: patched versions of transitive packages flagged by
# `pnpm audit` (2026-11-20), each kept inside its current major so the parent
# packages still get a compatible version. Drop an entry once its parent ships
# the fix itself.
overrides:
  source-map-js@<1.2.2: ^1.2.2
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  vite@>=8.3.0 <8.3.3: ^8.3.3
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  ip-address@<10.7.4: ^10.7.4
  systeminformation@<5.33.16: ^5.33.16
  qs@>=6.7.0 <6.16.1: ^6.16.1
  webpack-dev-middleware@<7.4.5: ^7.4.5
  # These two cross a major version. Checked against how each is called:
  # exceljs uses require('uuid').v4 (kept in uuid 11), and @ts-morph/common and
  # @typescript-eslint/typescript-estree call minimatch(...) by name (kept in
  # minimatch 11). Covered by tests/product-import-xlsx.test.ts and `pnpm lint`.
  uuid@<11.1.1: ^11.1.1
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
