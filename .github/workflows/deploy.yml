name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            # onnxruntime-node's install script otherwise downloads NVIDIA CUDA
            # GPU libraries (hundreds of MB) on Linux; this server is CPU-only,
            # and that download is what made deploys hang until the timeout.
            export ONNXRUNTIME_NODE_INSTALL=skip
            cd /var/www/app
            git pull origin master
            pnpm install
            # Pages left open across a deploy must keep saving: one fixed key for
            # Server Actions (created once, never leaves this server) and a
            # per-commit deployment id so stale tabs reload instead of erroring.
            grep -q '^NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=' .env || printf '\nNEXT_SERVER_ACTIONS_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> .env
            # The deployment id must reach BOTH the build and the running server
            # (next start reads .env). Exporting it only for the build left the
            # server without it, so every page lacked the id and each click did a
            # full reload. sed -i keeps .env's permissions.
            sed -i '/^NEXT_DEPLOYMENT_ID=/d' .env
            printf '\nNEXT_DEPLOYMENT_ID=%s\n' "$(git rev-parse --short HEAD)" >> .env
            pnpm run build
            pm2 restart app

            # Photo search (CLIP) service on the same server, local only: the app
            # calls it at http://127.0.0.1:8000 (IMAGE_SEARCH_SERVICE_URL in .env).
            # It reads IMAGE_SEARCH_SERVICE_TOKEN from the same /var/www/app/.env.
            cd /var/www/app/services/image-search
            npm ci --omit=dev --no-audit --no-fund
            if pm2 describe image-search > /dev/null 2>&1; then
              HOST=127.0.0.1 pm2 restart image-search --update-env
            else
              HOST=127.0.0.1 pm2 start src/server.js --name image-search --node-args="--env-file=/var/www/app/.env"
            fi
            pm2 save
